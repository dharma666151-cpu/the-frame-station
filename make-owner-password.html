<!doctype html><meta charset="utf-8"><title>Create Owner Password Hash</title>
<style>body{font-family:Arial;padding:25px;max-width:700px;margin:auto}input,button{padding:10px;margin:6px 0;width:100%}pre{white-space:pre-wrap;background:#eee;padding:15px}</style>
<h1>Create Cloudflare Owner Password Hash</h1><p>This runs only in your browser. Your password is not sent anywhere.</p>
<input id="pw" type="password" placeholder="Choose owner password"><button id="go">Generate</button><pre id="out"></pre>
<script>
function b64url(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'')}
go.onclick=async()=>{const salt=crypto.randomUUID();const enc=new TextEncoder();const key=await crypto.subtle.importKey('raw',enc.encode(pw.value),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:100000},key,256);out.textContent=`OWNER_PASSWORD_SALT=${salt}\nOWNER_PASSWORD_HASH=${b64url(new Uint8Array(bits))}`};
</script>
