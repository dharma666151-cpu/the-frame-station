<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Login | The Frame Station</title>
<link rel="stylesheet" href="/styles.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:#f7f1e6}
.login-card{width:min(430px,calc(100% - 28px));background:#fff;padding:34px;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.12)}
.login-card img{width:220px;margin:0 auto 18px}.login-card h1{font-size:2rem;text-align:center}
.login-card p{text-align:center;color:#6d675f}
.login-card label{display:block;font-weight:700;margin:14px 0 6px}
.login-card input{width:100%;padding:13px;border:1px solid #d9cdbd;border-radius:10px}
.login-card button{width:100%;margin-top:18px}.error{color:#b42318;min-height:22px;text-align:center}
</style></head>
<body>
<main class="login-card">
<img src="/assets/logo.png" alt="The Frame Station">
<h1>Owner Login</h1>
<p>Manage products, prices, WhatsApp and homepage content.</p>
<form id="loginForm">
<label>Email</label><input id="email" type="email" autocomplete="username" required>
<label>Password</label><input id="password" type="password" autocomplete="current-password" required>
<div class="error" id="error"></div>
<button class="btn btn-primary" type="submit">Login</button>
</form>
</main>
<script>
(async()=>{try{const r=await fetch('/api/session');if(r.ok)location.href='/admin/dashboard.html'}catch{}})();
document.getElementById('loginForm').addEventListener('submit',async e=>{
 e.preventDefault(); error.textContent='';
 const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
 const j=await r.json().catch(()=>({}));
 if(r.ok) location.href='/admin/dashboard.html'; else error.textContent=j.error||'Login failed.';
});
</script></body></html>
